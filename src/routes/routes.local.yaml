gateway:
  cors:
    origins: ["http://localhost.com", "https://api-hml.frani.com.br"]
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    credentials: true
  security:
    enforceHttps: false
    helmet: true
    sanitizePayload: true

services:
  store-service:
    baseUrl: http://localhost:3333
    jwt_enabled: false # Habilita JWT para TODAS as rotas deste serviço por padrão
    jwt_secret: "secret-local" # Secret específico (opcional, usa o global se não definido)

routes:
  - path: /store/*
    methods: any
    service: store-service
    middlewares: [loggerMiddleware]

  - path: /auth/sign-in
    methods: POST
    service: store-service
    target: /sessions

  - path: /auth/refresh
    methods: POST
    service: store-service
    target: /sessions/refresh-token

  - path: /settings/key/:key
    methods: GET
    service: store-service
    target: /settings/key/:key
    middlewares: [loggerMiddleware]

  - path: /settings/key/:key/public
    methods: GET
    service: store-service
    target: /settings/key/:key/public
    middlewares: [loggerMiddleware]

  - path: /settings
    methods: POST
    service: store-service
    target: /settings
    middlewares: [loggerMiddleware]
